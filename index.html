<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRS Rent a Car · Pérez Zeledón</title>
    <meta
      name="description"
      content="Alquiler de vehículos en Pérez Zeledón, zona sur de Costa Rica."
    />
    <meta name="theme-color" content="#1f3f1f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica tema e idioma antes de pintar para evitar parpadeos.
      (function () {
        var root = document.documentElement;
        var theme = null;
        var lang = null;
        try {
          theme = localStorage.getItem('mrs-theme');
          lang = localStorage.getItem('mrs-lang');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);
        root.setAttribute('lang', lang === 'en' ? 'en' : 'es');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
