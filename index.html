<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo:start-->
    <title>MRS Rent a Car | Alquiler de carros en Pérez Zeledón, zona sur</title>
    <!--seo:end-->
    <meta name="theme-color" content="#1f3f1f" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica tema e idioma antes de pintar para evitar parpadeos.
      (function () {
        var root = document.documentElement;
        var theme = null;
        try {
          theme = localStorage.getItem('mrs-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        root.setAttribute('data-theme', theme);
        // El idioma lo define la URL: /en/ es inglés.
        root.setAttribute('lang', /^\/en(\/|$)/.test(location.pathname) ? 'en' : 'es');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
